<title>Neuronatica QA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* ── Tokens ── */
:root{
  --bg:#ffffff; --surface:#f7f8fa; --surface-2:#eef0f4; --line:#e3e5e9; --line-2:#edf0f3;
  --fg:#111827; --fg-2:#4b5563; --fg-3:#9ca3af;
  --blue:#2563eb; --blue-dk:#1d4ed8; --blue-mid:#3b82f6; --blue-soft:#eff6ff; --blue-ring:rgba(37,99,235,.18);
  --auto:#6b7280; --auto-soft:#f3f4f6;
  --green:#16a34a; --green-soft:#f0fdf4; --green-dk:#15803d;
  --amber:#d97706; --amber-soft:#fffbeb;
  --red:#dc2626; --red-soft:#fef2f2;
  --shadow-xs:0 1px 2px rgba(0,0,0,.06);
  --shadow-sm:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06);
  --shadow-md:0 4px 6px -1px rgba(0,0,0,.1),0 2px 4px -2px rgba(0,0,0,.06);
  --radius:6px; --radius-lg:10px; --radius-pill:99px;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --ease-out:cubic-bezier(.22,1,.36,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:var(--radius)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── Animations ── */
@keyframes fadeSlideUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fadeSlideIn{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
@keyframes itemIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
@keyframes scaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes ripple{from{transform:scale(0);opacity:.35}to{transform:scale(4);opacity:0}}

.anim-fade-up{animation:fadeSlideUp .28s var(--ease-out) both}
.anim-slide-in{animation:fadeSlideIn .32s var(--ease-out) both}
.anim-scale-in{animation:scaleIn .22s var(--ease-out) both}

/* ── Layout ── */
.app{height:100%;display:grid;grid-template-rows:56px 1fr}

/* ── App bar ── */
.top{display:flex;align-items:center;gap:16px;padding:0 max(20px,env(safe-area-inset-right,0px)) 0 max(20px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--bg);box-shadow:var(--shadow-xs)}
.brand{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--fg-2);letter-spacing:-.02em}
.brand .mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#2563eb,#7c3aed);display:grid;place-items:center;box-shadow:0 2px 8px rgba(37,99,235,.35)}
.brand b{color:var(--fg);font-weight:600;letter-spacing:-.03em}
.crumb{font-size:13px;color:var(--fg-3);padding-left:16px;border-left:1px solid var(--line-2)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.period{display:flex;align-items:center;gap:7px;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:var(--radius);font-size:12px;color:var(--fg-2);background:var(--surface);gap:7px}
.period svg{color:var(--fg-3)}
.period b{color:var(--fg);font-weight:500;font-size:13px}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600;letter-spacing:.01em;box-shadow:var(--shadow-xs)}
.who{font-size:11px;color:var(--fg-3);line-height:1.3;text-align:right}
.who b{display:block;color:var(--fg);font-weight:500;font-size:13px}

/* ── Shell ── */
.shell{display:grid;grid-template-columns:228px 1fr;min-height:0}
.side{background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:10px 10px;gap:1px;min-height:0;overflow:auto}
.side .lbl{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-3);padding:14px 12px 5px;font-weight:600}
.nav{display:flex;align-items:center;gap:11px;height:36px;padding:0 12px;border-radius:var(--radius);color:var(--fg-2);font-size:13.5px;font-weight:500;width:100%;text-align:left;transition:background 130ms var(--ease-out),color 130ms var(--ease-out)}
.nav svg{flex:none;opacity:.7;transition:opacity 130ms}
.nav:hover{background:var(--surface-2);color:var(--fg)}
.nav:hover svg{opacity:1}
.nav.on{background:var(--blue-soft);color:var(--blue-dk);font-weight:600}
.nav.on svg{opacity:1;color:var(--blue)}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--blue);color:#fff;border-radius:var(--radius-pill);padding:1px 7px;font-weight:600;letter-spacing:.01em;min-width:20px;text-align:center}
.side-foot{margin-top:auto;padding:14px 12px 12px;border-top:1px solid var(--line-2);font-size:11.5px;color:var(--fg-3);line-height:1.6}
.side-foot b{color:var(--fg-2);font-weight:600;font-size:12px}

.main{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.view{display:none;min-height:0;flex:1;flex-direction:column}
.view.on{display:flex}

/* ── KPI strip ── */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line);background:var(--bg)}
.kpi{padding:14px 20px;min-width:0;border-right:1px solid var(--line-2);animation:fadeSlideUp .3s var(--ease-out) both}
.kpi:nth-child(1){animation-delay:.04s}.kpi:nth-child(2){animation-delay:.08s}.kpi:nth-child(3){animation-delay:.12s}.kpi:nth-child(4){animation-delay:.16s}.kpi:nth-child(5){animation-delay:.20s}
.kpi:last-child{border-right:0}
.kpi .k{font-size:11px;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;letter-spacing:.015em;text-transform:uppercase}
.kpi .v{font-size:24px;font-weight:600;margin-top:5px;display:flex;align-items:baseline;gap:6px;letter-spacing:-.03em;color:var(--fg)}
.kpi .v small{font-size:12px;color:var(--fg-3);font-weight:400;letter-spacing:0}
.kpi .t{font-size:11.5px;color:var(--fg-3);margin-top:2px}
.kpi .t.up{color:var(--green);font-weight:500}
.kpi.human .v{color:var(--blue)}

/* ── Inbox ── */
.cols{display:grid;grid-template-columns:312px 1fr 308px;min-height:0;flex:1}
.list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.list-head{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:9px;background:var(--bg)}
.list-head .row{display:flex;align-items:center;justify-content:space-between}
.list-head .ttl{font-weight:600;font-size:13px;letter-spacing:-.01em}
.list-head .sub{font-size:12px;color:var(--fg-3)}
.search{display:flex;align-items:center;gap:8px;height:38px;padding:0 11px;background:var(--surface);border-radius:var(--radius);border:1px solid var(--line-2);color:var(--fg-3);transition:border-color .15s,box-shadow .15s}
.search:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-ring);color:var(--fg-2)}
.search input{background:none;border:0;outline:0;width:100%;font-size:13.5px;color:var(--fg)}
.search input::placeholder{color:var(--fg-3)}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.seg button{flex:1;height:30px;font-size:12.5px;color:var(--fg-2);border-right:1px solid var(--line);background:transparent;font-weight:500;transition:background .12s,color .12s}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--surface-2);color:var(--fg)}
.seg button.on{background:var(--bg);color:var(--blue);font-weight:600;box-shadow:var(--shadow-xs)}
.fsel{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--fg-2)}
.fsel select{height:30px;border:1px solid var(--line);border-radius:var(--radius);padding:0 8px;background:var(--bg);flex:1;outline:0;font-size:12.5px;color:var(--fg);cursor:pointer}
.items{overflow:auto;flex:1}
.day{position:sticky;top:0;background:var(--surface);font-size:10.5px;color:var(--fg-3);letter-spacing:.06em;text-transform:uppercase;font-weight:600;padding:6px 16px;border-bottom:1px solid var(--line-2);z-index:1}
.item{display:grid;grid-template-columns:1fr auto;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line-2);width:100%;text-align:left;border-left:3px solid transparent;transition:background 100ms,box-shadow 120ms var(--ease-out),transform 120ms var(--ease-out);position:relative;animation:itemIn .28s var(--ease-out) both}
.item:hover{background:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.07);transform:translateY(-1px);z-index:1}
.item:active{transform:translateY(0);box-shadow:none}
.item.on{background:var(--blue-soft);border-left-color:var(--blue)}
.item.p-high{border-left-color:var(--red)}
.item.p-mid{border-left-color:var(--amber)}
.item.on.p-high{border-left-color:var(--red)}.item.on.p-mid{border-left-color:var(--amber)}
.item .n{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:8px;min-width:0;letter-spacing:-.01em}
.item .n span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .m{font-size:12px;color:var(--fg-2);margin-top:2px;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.item .m i{font-style:normal;color:var(--fg)}
.dir{font-size:10.5px;color:var(--fg-3);font-weight:600;letter-spacing:.04em;padding:2px 6px;background:var(--surface-2);border-radius:var(--radius-pill)}
.dir.out{color:var(--blue);background:var(--blue-soft)}
.score{font-size:15px;font-weight:700;min-width:34px;text-align:right;align-self:start;letter-spacing:-.02em}
.s-ok{color:var(--green)} .s-warn{color:var(--amber)} .s-bad{color:var(--red)}
.st{font-size:11.5px;display:inline-flex;align-items:center;gap:5px;color:var(--fg-3);font-weight:500}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--fg-3);flex:none}
.st.rev::before{background:var(--amber)}.st.risk::before{background:var(--red)}.st.done::before{background:var(--blue)}.st.auto::before{background:var(--green)}
.st.risk{color:var(--red)}

/* ── Empty state ── */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:16px;padding:40px 32px;text-align:center;animation:scaleIn .25s var(--ease-out)}
.empty-state svg{opacity:.25}
.empty-state h3{font-size:15px;font-weight:600;color:var(--fg);letter-spacing:-.01em}
.empty-state p{font-size:13px;color:var(--fg-3);max-width:28ch;line-height:1.6}

/* ── Detail ── */
.detail{min-width:0;min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--line)}
.d-head{padding:16px 20px 12px;border-bottom:1px solid var(--line);display:flex;gap:18px;align-items:flex-start;animation:fadeSlideUp .26s var(--ease-out) both}
.d-head .ti{flex:1;min-width:0}
.d-head h2{font-size:17px;font-weight:600;display:flex;gap:9px;align-items:center;flex-wrap:wrap;letter-spacing:-.025em}
.d-head h2 .num{font-size:11.5px;color:var(--fg-3);font-weight:400;letter-spacing:0}
.d-head .meta{font-size:12px;color:var(--fg-3);margin-top:5px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.d-head .meta b{color:var(--fg-2);font-weight:500}
.d-head .meta .sep{width:3px;height:3px;border-radius:50%;background:var(--line);flex:none}
.rings{display:flex;gap:14px;flex:none}
.ring{position:relative;width:54px;height:54px;flex:none}
.ring svg{transform:rotate(-90deg);filter:drop-shadow(0 1px 3px rgba(0,0,0,.1))}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:700;letter-spacing:-.02em}
.ring .lab{position:absolute;left:0;right:0;bottom:-17px;text-align:center;font-size:10px;color:var(--fg-3);font-weight:500;letter-spacing:.02em;text-transform:uppercase}
.rings{padding-bottom:18px}

.notice{margin:14px 20px 0;border:1px solid var(--line-2);border-radius:var(--radius-lg);padding:12px 16px;background:var(--surface);display:flex;gap:12px;align-items:flex-start;animation:fadeSlideUp .3s .06s var(--ease-out) both}
.notice.h{background:var(--amber-soft);border-color:#fde68a}
.notice .ic{width:22px;height:22px;border-radius:50%;background:var(--surface-2);color:var(--fg-3);display:grid;place-items:center;flex:none;margin-top:1px}
.notice.h .ic{background:#fde68a;color:var(--amber)}
.notice p{font-size:13px;color:var(--fg-2);line-height:1.55}
.notice p b{color:var(--fg);font-weight:600}
.notice .why{margin-top:7px;display:flex;gap:8px;flex-wrap:wrap}

.d-tabs{display:flex;padding:0 20px;border-bottom:1px solid var(--line);margin-top:14px;gap:4px}
.d-tab{padding:0 14px;height:40px;font-size:13px;color:var(--fg-3);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500;border-radius:var(--radius) var(--radius) 0 0;transition:background .12s,color .12s,border-color .12s}
.d-tab:hover{background:var(--surface);color:var(--fg-2)}
.d-tab.on{color:var(--blue);border-color:var(--blue);font-weight:600}
.d-body{overflow:auto;flex:1;min-height:0}
.d-pane{display:none;padding:18px 20px;animation:fadeSlideUp .22s var(--ease-out) both}
.d-pane.on{display:block}

.turn{display:grid;grid-template-columns:44px 1fr;gap:10px;margin-bottom:16px}
.turn .ts{font-family:var(--mono);font-size:11.5px;color:var(--fg-3);padding-top:3px;text-align:right}
.turn .who{font-size:12px;font-weight:600;margin-bottom:4px;letter-spacing:-.01em}
.turn.a .who{color:var(--blue)}.turn.c .who{color:var(--fg-3)}
.bub{font-size:13.5px;line-height:1.65;max-width:70ch;color:var(--fg)}
.turn.c .bub{color:var(--fg-2)}
.bub mark{background:var(--amber-soft);color:var(--fg);border-bottom:2px solid #f59e0b;padding:0 2px;border-radius:2px}
.fl{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 8px;border-radius:var(--radius-pill);margin-top:6px;margin-right:5px;background:var(--surface);border:1px solid var(--line);color:var(--fg-3);cursor:pointer;transition:background .1s,border-color .1s;font-weight:500}
.fl::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--fg-3);flex:none}
.fl.bad::before{background:var(--red)}.fl.warn::before{background:var(--amber)}.fl.ok::before{background:var(--green)}
.fl:hover{background:var(--surface-2);border-color:var(--line)}

.wave{display:flex;align-items:center;gap:10px;padding:10px 20px;border-top:1px solid var(--line);background:var(--surface);flex:none}
.play{width:30px;height:30px;border-radius:50%;background:var(--blue);display:grid;place-items:center;flex:none;box-shadow:0 2px 6px rgba(37,99,235,.3);transition:background .12s,transform .1s;border:0}
.play:hover{background:var(--blue-dk);transform:scale(1.05)}
.play:active{transform:scale(.95)}
.bars{display:flex;align-items:center;gap:2px;height:26px;flex:1;min-width:0;overflow:hidden}
.bars i{width:3px;border-radius:2px;background:var(--line);flex:none;transition:background .1s}
.bars i.on{background:var(--blue)}
.wt{font-family:var(--mono);font-size:11.5px;color:var(--fg-3);flex:none}

.sum p{font-size:13.5px;color:var(--fg-2);line-height:1.65;max-width:70ch}
.sum h4{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);margin:20px 0 9px;font-weight:600}
.sum h4:first-child{margin-top:0}
.sum ul{list-style:none;display:grid;gap:9px}
.sum li{display:grid;grid-template-columns:20px 1fr;gap:10px;font-size:13.5px;color:var(--fg-2);max-width:72ch;line-height:1.55}
.sum li b{color:var(--fg);font-weight:600}
.dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none;margin-top:1px}
.dot.ok{background:var(--green-soft);color:var(--green)}.dot.warn{background:var(--amber-soft);color:var(--amber)}.dot.bad{background:var(--red-soft);color:var(--red)}.dot.ai{background:var(--surface-2);color:var(--fg-3)}.dot.hu{background:var(--blue-soft);color:var(--blue)}

/* ── Evaluation ── */
.verdict{display:flex;flex-direction:column;min-height:0;background:var(--bg);animation:fadeSlideIn .3s var(--ease-out) both}
.v-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.v-head .ttl{font-weight:600;font-size:13.5px;letter-spacing:-.01em}
.legend{display:flex;gap:10px;font-size:11px;color:var(--fg-3);margin-top:4px;font-weight:500}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle}
.v-body{overflow:auto;flex:1;min-height:0}
.attr{padding:11px 16px;border-bottom:1px solid var(--line-2);transition:background .1s}
.attr:hover{background:var(--surface)}
.attr .r1{display:flex;align-items:center;gap:8px}
.attr .nm{font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.attr .w{font-family:var(--mono);font-size:10.5px;color:var(--fg-3);background:var(--surface-2);padding:1px 5px;border-radius:var(--radius);font-weight:500}
.attr .sc{font-size:13.5px;font-weight:700;min-width:30px;text-align:right;letter-spacing:-.02em}
.attr .conf{font-size:10.5px;color:var(--fg-3);font-family:var(--mono);background:var(--surface);padding:1px 5px;border-radius:var(--radius-pill)}
.attr .conf.low{color:var(--amber);background:var(--amber-soft)}
.track{position:relative;height:5px;background:var(--surface-2);border-radius:3px;margin-top:9px}
.track .ai{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--auto);transition:width .3s var(--ease-out)}
.track .hm{position:absolute;top:-5px;width:3px;height:15px;background:var(--blue);border-radius:2px;transform:translateX(-1px);box-shadow:0 0 0 2px rgba(37,99,235,.2)}
.attr .ev{font-size:12.5px;color:var(--fg-2);margin-top:9px;display:none;line-height:1.55;animation:fadeSlideUp .2s var(--ease-out)}
.attr .ev q{color:var(--fg);font-style:italic}
.attr.open .ev{display:block}
.attr .adj{display:none;margin-top:9px;align-items:center;gap:8px}
.attr.open .adj{display:flex}
.attr input[type=range]{flex:1;accent-color:var(--blue);height:4px;cursor:pointer}
.attr .ov{font-family:var(--mono);font-size:12px;color:var(--blue);min-width:34px;text-align:right;font-weight:600}
.attr .reset{font-size:12px;color:var(--fg-3);font-weight:500;padding:2px 6px;border-radius:var(--radius);transition:background .1s,color .1s}
.attr .reset:hover{background:var(--surface-2);color:var(--red)}
.attr.overridden .nm::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--blue);margin-left:8px;vertical-align:middle}

.v-foot{border-top:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:var(--bg);flex:none}
.v-foot textarea{width:100%;min-height:70px;resize:vertical;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;font-size:13px;outline:0;line-height:1.55;transition:border-color .15s,box-shadow .15s;color:var(--fg)}
.v-foot textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-ring);background:var(--bg)}
.v-foot textarea::placeholder{color:var(--fg-3)}
.v-foot .lbl{font-size:12px;color:var(--fg-2);display:flex;justify-content:space-between;align-items:center;font-weight:500}

/* ── Buttons ── */
.btn{height:34px;padding:0 14px;border-radius:var(--radius);border:1px solid var(--line);font-size:13px;font-weight:500;color:var(--blue);display:inline-flex;align-items:center;gap:7px;justify-content:center;background:var(--bg);letter-spacing:.005em;transition:background .12s,border-color .12s,box-shadow .12s,transform .1s;position:relative;overflow:hidden}
.btn:hover{background:var(--blue-soft);border-color:rgba(37,99,235,.3)}
.btn:active{transform:scale(.97)}

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function scoreFrom(tpl){const base={};ATTRS.forEach(a=>base[a.id]=80);tpl.forEach(t=>(t[3]||[]).forEach(f=>{base[f[0]]=f[1]==='ok'?96:f[1]==='warn'?58:22}));const s={};ATTRS.forEach(a=>s[a.id]=clamp(base[a.id]+Math.round((rnd()-.5)*12),5,100));return s}
function weighted(s){let t=0,w=0;ATTRS.forEach(a=>{t+=s[a.id]*a.w;w+=a.w});return Math.round(t/w)}

const CALLS=[];let n=1;
for(let d=1;d<=16;d++){
  const perDay=d===16?4:(d%7===3||d%7===4)?1:3;
  for(let i=0;i<perDay;i++){
    const dir=rnd()<.68?'out':'in';
    const ag=dir==='out'?pick(AGENTS.filter(a=>a.team.startsWith('Salientes'))):pick(AGENTS.filter(a=>a.team.startsWith('Entrantes')));
    const r=rnd();const tk=dir==='out'?(r<.5?'out_ok':r<.8?'out_obj':'out_risk'):(r<.6?'in_ok':'in_mid');
    const ai=scoreFrom(T[tk]);
    const conf={};ATTRS.forEach(a=>conf[a.id]=clamp(Math.round(72+rnd()*26-(a.id==='cumplimiento'||a.id==='objeciones'?8:0)),52,98));
    const total=weighted(ai);const lowConf=Object.values(conf).filter(c=>c<68).length;const risk=ai.cumplimiento<45;
    const reasons=[];
    if(risk)reasons.push({k:'risk',t:'Riesgo de cumplimiento'});
    if(total>=58&&total<=72)reasons.push({k:'rev',t:'Puntaje en zona límite'});
    if(lowConf>=2)reasons.push({k:'rev',t:`Baja confianza en ${lowConf} atributos`});
    if(tk==='out_obj'&&rnd()<.5)reasons.push({k:'rev',t:'El cliente colgó antes de 1 min'});
    const needs=reasons.length>0;
    const hh=dir==='out'?9+Math.floor(rnd()*8):8+Math.floor(rnd()*10),mm=Math.floor(rnd()*60);
    const dur=tk.includes('ok')?240+Math.floor(rnd()*300):60+Math.floor(rnd()*160);
    const outcome=tk==='out_ok'||tk==='out_risk'?'Venta cerrada':tk==='in_ok'?'Seguimiento agendado':tk==='in_mid'?'Sin seguimiento':'Sin venta';
    const status=d<13&&rnd()<.75?'done':needs?'rev':'auto';
    const human={};if(status==='done'){ATTRS.forEach(a=>{if(rnd()<.22)human[a.id]=clamp(ai[a.id]+Math.round((rnd()-.5)*22),0,100)})}
    CALLS.push({id:'INT-'+String(n++).padStart(4,'0'),day:d,hh,mm,dir,agent:ag,cust:pick(CUST),camp:pick(CAMP[dir]),tk,dur,ai,conf,human,status,reasons,outcome,note:status==='done'?'Revisada el '+(d+1)+' de octubre.':'',fb:''});
  }
}
CALLS.sort((a,b)=>b.day-a.day||b.hh-a.hh||b.mm-a.mm);

const DOW=['dom','lun','mar','mié','jue','vie','sáb'];
const dayLabel=d=>`${DOW[new Date(2026,9,d).getDay()]} ${d} oct`;

const col=v=>v>=80?'var(--green)':v>=60?'var(--amber)':'var(--red)';
const soft=v=>v>=80?'var(--green-soft)':v>=60?'var(--amber-soft)':'var(--red-soft)';
const finalScores=c=>{const s={};ATTRS.forEach(a=>s[a.id]=c.human[a.id]!=null?c.human[a.id]:c.ai[a.id]);return s};

/* Ripple helper */
function addRipple(btn){
  btn.addEventListener('click',e=>{
    const r=btn.getBoundingClientRect();const sz=Math.max(r.width,r.height)*1.4;
    const el=document.createElement('span');el.className='ripple-el';
    el.style.cssText=`width:${sz}px;height:${sz}px;left:${e.clientX-r.left-sz/2}px;top:${e.clientY-r.top-sz/2}px`;
    btn.appendChild(el);setTimeout(()=>el.remove(),520);
  });
}

  const tot=CALLS.length,done=CALLS.filter(c=>c.status==='done').length,rev=CALLS.filter(c=>c.status==='rev').length,auto=CALLS.filter(c=>c.status==='auto').length;
  const avg=Math.round(CALLS.reduce((s,c)=>s+finalTotal(c),0)/tot);
  const minutesListened=CALLS.filter(c=>c.status==='done').reduce((s,c)=>s+c.dur,0);

/* ── EVALUATION ── */
function renderVerdict(){
  const c=CALLS.find(x=>x.id===cur);if(!c)return;
  const rows=ATTRS.map(a=>{
    const h=c.human[a.id];const ov=h!=null;const fv=ov?h:c.ai[a.id];
    const ev=[];T[c.tk].forEach(t=>(t[3]||[]).forEach(f=>{if(f[0]===a.id)ev.push({ts:t[1],k:f[1],t:f[2],q:t[2].replace('{C}',c.cust.split(' ')[0]).replace('{A}',c.agent.n.split(' ')[0])})}));
    return`<div class="attr ${ov?'overridden':''}" data-attr="${a.id}">
      <button class="r1" style="width:100%;text-align:left" data-tg>
        <span class="nm">${a.n}</span>
        <span class="w">×${a.w}</span>
        <span class="conf ${c.conf[a.id]<68?'low':''}">${c.conf[a.id]}%</span>
        <span class="sc" style="color:${col(fv)}">${fv}</span>
      </button>
      <div class="track"><div class="ai" style="width:${c.ai[a.id]}%"></div>${ov?`<div class="hm" style="left:${h}%"></div>`:''}</div>
      <div class="ev">${ev.length?ev.map(e=>`<div style="margin-bottom:7px"><span class="num" style="font-size:11px;color:var(--fg-3)">${e.ts}</span> · <span style="color:${e.k==='ok'?'var(--green)':e.k==='warn'?'var(--amber)':'var(--red)'};font-weight:600">${esc(e.t)}</span><br><q style="font-size:12.5px">${esc(e.q.length>110?e.q.slice(0,110)+'…':e.q)}</q></div>`).join(''):'<span style="color:var(--fg-3);font-size:12px">Sin evidencia específica; puntaje por ausencia de incidencias. </span>'}<span style="color:var(--fg-3);font-size:12px;display:block;margin-top:6px">${esc(a.d)}</span></div>
      <div class="adj"><input type="range" min="0" max="100" value="${fv}" data-r="${a.id}" ${c.status==='done'?'disabled':''} aria-label="Ajuste de la analista"><span class="ov">${ov?h:'—'}</span>${ov&&c.status!=='done'?`<button class="reset" data-reset="${a.id}">Quitar</button>`:''}</div>
    </div>`;
  }).join('');
  const nOv=Object.keys(c.human).length;
  $('#verdict').innerHTML=`
   <div class="v-head">
     <div><div class="ttl">Evaluación</div><div class="legend"><span><i style="background:var(--auto)"></i>Automática</span><span><i style="background:var(--blue)"></i>Analista</span><span style="color:var(--fg-3)">% confianza</span></div></div>
     <button class="btn txt sm back" id="back2">← Transcripción</button>
   </div>
   <div class="v-body">${rows}</div>
   <div class="v-foot">
     ${c.status==='done'?
       `<div class="done-note">${ICO.human}&nbsp;Evaluación firmada · ${nOv} ajuste${nOv===1?'':'s'}</div>${c.fb?`<div style="font-size:13px;color:var(--fg-2);line-height:1.55"><b style="color:var(--fg);font-weight:600">Feedback enviado:</b> ${esc(c.fb)}</div>`:''}`
       :`
       <div class="lbl"><span>Feedback para ${esc(c.agent.n.split(' ')[0])}</span><button class="btn txt sm" id="draft">Generar borrador</button></div>
       <textarea id="fb" placeholder="Escribí el feedback o generá un borrador. Vos decidís qué se envía.">${esc(c.fb)}</textarea>
       <div class="brow"><button class="btn" id="later">Guardar</button><button class="btn pri" id="confirm">Confirmar y enviar</button></div>
       <div style="font-size:11.5px;color:var(--fg-3)">${nOv?`${nOv} atributo${nOv===1?'':'s'} ajustado${nOv===1?'':'s'} · puntaje final ${finalTotal(c)} (automático ${aiTotal(c)})`:'Sin ajustes: al confirmar, el puntaje final será el automático ('+aiTotal(c)+')'}</div>`
     }
   </div>`;

  const V=$('#verdict');
  V.querySelectorAll('[data-tg]').forEach(b=>b.onclick=()=>b.closest('.attr').classList.toggle('open'));
  V.querySelectorAll('input[type=range]').forEach(r=>{
    r.oninput=()=>{
      c.human[r.dataset.r]=+r.value;
      const at=r.closest('.attr');at.classList.add('overridden');
      at.querySelector('.ov').textContent=r.value;
      at.querySelector('.sc').textContent=r.value;
      at.querySelector('.sc').style.color=col(+r.value);
      let hm=at.querySelector('.hm');
      if(!hm){hm=document.createElement('div');hm.className='hm';at.querySelector('.track').appendChild(hm)}
      hm.style.left=r.value+'%';
    };
    r.onchange=()=>{renderVerdict();V.querySelector(`[data-attr="${r.dataset.r}"]`).classList.add('open')};
  });
  V.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>{delete c.human[b.dataset.reset];renderVerdict()});
  $('#back2').onclick=()=>$('#cols').classList.remove('show-v');
  if(c.status!=='done'){
    $('#fb').oninput=e=>c.fb=e.target.value;
    $('#draft').onclick=()=>{
      const fs=finalScores(c);
      const weak=ATTRS.filter(a=>fs[a.id]<60).sort((x,y)=>fs[x.id]-fs[y.id]).slice(0,2);
      const strong=ATTRS.filter(a=>fs[a.id]>=85).slice(0,2);
      const txt=`Hola ${c.agent.n.split(' ')[0]}, revisé tu llamada con ${c.cust} del ${dayLabel(c.day)}.${strong.length?` Destaco ${strong.map(a=>a.n.toLowerCase()).join(' y ')}: se nota el trabajo.`:''}${weak.length?` Para la próxima, enfocate en ${weak.map(a=>a.n.toLowerCase()).join(' y ')}: ${weak[0].d.charAt(0).toLowerCase()+weak[0].d.slice(1)}`:''}${c.reasons.some(r=>r.k==='risk')?' Ojo con prometer cobertura "sin excepciones": la póliza tiene exclusiones y eso nos expone a reclamos. Lo vemos juntos en la sesión del jueves.':' ¿Lo conversamos 10 minutos esta semana?'}`;
      c.fb=txt;$('#fb').value=txt;toast('Borrador listo. Revisalo antes de enviar.');
    };
    $('#later').onclick=()=>toast('Guardado. La llamada sigue pendiente.');
    const confirmBtn=$('#confirm');
    addRipple(confirmBtn);
    confirmBtn.onclick=()=>{c.status='done';c.note='Revisada hoy.';renderKpis();renderList();select(c.id);toast(`Evaluación firmada y feedback enviado a ${c.agent.n.split(' ')[0]}.`)};
  }
}

/* ── AGENTS ── */
function spark(vals,color){
  const w=90,h=22;if(vals.length<2)return'';
  const mn=Math.min(...vals),mx=Math.max(...vals);
  const pts=vals.map((v,i)=>`${(i/(vals.length-1)*w).toFixed(1)},${(h-2-(v-mn)/(mx-mn||1)*(h-4)).toFixed(1)}`);
  return`<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round"/><circle cx="${pts[pts.length-1].split(',')[0]}" cy="${pts[pts.length-1].split(',')[1]}" r="2.5" fill="${color}"/></svg>`;
}

function renderAgents(){
  const rows=AGENTS.map(ag=>{
    const cs=CALLS.filter(c=>c.agent.id===ag.id);const tot=cs.length;
    const avg=Math.round(cs.reduce((s,c)=>s+finalTotal(c),0)/tot);
    const byWeek=[[1,7],[8,14],[15,16]].map(([a,b])=>{const x=cs.filter(c=>c.day>=a&&c.day<=b);return x.length?Math.round(x.reduce((s,c)=>s+finalTotal(c),0)/x.length):avg});
    const attrAvg={};ATTRS.forEach(a=>attrAvg[a.id]=Math.round(cs.reduce((s,c)=>s+finalScores(c)[a.id],0)/tot));
    const best=ATTRS.reduce((p,a)=>attrAvg[a.id]>attrAvg[p.id]?a:p),worst=ATTRS.reduce((p,a)=>attrAvg[a.id]<attrAvg[p.id]?a:p);
    return{ag,tot,avg,byWeek,best,worst,pend:cs.filter(c=>c.status==='rev').length,sales:cs.filter(c=>c.outcome.includes('cerrada')).length,risk:cs.filter(c=>c.reasons.some(r=>r.k==='risk')).length};
  }).sort((a,b)=>b.avg-a.avg);

  $('#p-agents').innerHTML=`<h1>Agentes</h1><p class="lead">Promedio ponderado con la matriz de 12 atributos, con los ajustes de la analista incorporados. Fortaleza y oportunidad se calculan con los datos; la decisión de coaching es de la analista.</p>
   <div class="card" style="overflow-x:auto"><table><thead><tr><th>Agente</th><th>Llamadas</th><th>Ventas</th><th>Puntaje</th><th>Semanas 1→3</th><th>Fortaleza</th><th>Oportunidad</th><th>Pendientes</th><th>Riesgo</th></tr></thead><tbody>
   ${rows.map(r=>`<tr><td><div class="ag"><div class="av" style="background:${r.ag.c}">${r.ag.ini}</div><div>${esc(r.ag.n)}<small>${r.ag.team}</small></div></div></td><td class="num">${r.tot}</td><td class="num">${r.sales}</td><td><span class="score ${sCls(r.avg)}" style="text-align:left">${r.avg}</span></td><td>${spark(r.byWeek,col(r.avg))}</td><td style="color:var(--green);font-size:12.5px">${r.best.n}</td><td style="color:var(--amber);font-size:12.5px">${r.worst.n}</td><td class="num" style="color:${r.pend?'var(--blue)':'var(--fg-3)'}">${r.pend}</td><td class="num" style="color:${r.risk?'var(--red)':'var(--fg-3)'}">${r.risk}</td></tr>`).join('')}
   </tbody></table></div>
   <div class="grid2">
     <div class="card"><h3>Atributo por agente <small>puntaje promedio</small></h3>
     <div class="heat"><div></div>${rows.map(r=>`<div class="hh" title="${esc(r.ag.n)}">${r.ag.ini}</div>`).join('')}
     ${ATTRS.map(a=>`<div class="hl" title="${a.n}">${a.n}</div>${rows.map(r=>{const cs=CALLS.filter(c=>c.agent.id===r.ag.id);const v=Math.round(cs.reduce((s,c)=>s+finalScores(c)[a.id],0)/cs.length);return`<div class="hc" style="background:${soft(v)};color:${col(v)}">${v}</div>`}).join('')}`).join('')}</div></div>
     <div class="card"><h3>Sugerencias de coaching</h3><div class="sum"><ul>
     ${rows.slice(-2).reverse().map(r=>`<li><span class="dot warn">${ICO.warn}</span><span><b>${esc(r.ag.n)}</b>: ${r.worst.n.toLowerCase()} es su atributo más bajo en ${r.tot} llamadas. Sesión sugerida de 20 min con dos llamadas de ejemplo (una de ${esc(rows[0].ag.n.split(' ')[0])} y una suya).</span></li>`).join('')}
     <li><span class="dot ok">${ICO.ok}</span><span><b>${esc(rows[0].ag.n)}</b> lidera el mes. Sus llamadas en ${rows[0].best.n.toLowerCase()} sirven como referencia para calibrar al equipo.</span></li>
     <li><span class="dot hu">${ICO.human}</span><span>Son sugerencias. Quién recibe coaching, cuándo y cómo, lo decide la analista con supervisión.</span></li></ul></div></div>
   </div>`;
}

/* ── TRENDS ── */
function renderTrends(){
  const days=[];for(let d=1;d<=16;d++){const cs=CALLS.filter(c=>c.day===d);days.push({d,n:cs.length,avg:cs.length?Math.round(cs.reduce((s,c)=>s+finalTotal(c),0)/cs.length):null,out:cs.filter(c=>c.dir==='out').length,inn:cs.filter(c=>c.dir==='in').length})}
  const W=640,H=210,pl=36,pr=12,pt=14,pb=30;const iw=W-pl-pr,ih=H-pt-pb;
  const x=i=>pl+i/15*iw,y=v=>pt+ih-(v-40)/60*ih;
  const line=days.map((o,i)=>o.avg!=null?`${x(i).toFixed(1)},${y(o.avg).toFixed(1)}`:null).filter(Boolean);
  const chart=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:100%;display:block;font-family:var(--sans);font-size:11px">
   ${[40,60,80,100].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line-2)"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end" fill="var(--fg-3)">${v}</text>`).join('')}
   <rect x="${pl}" y="${y(80)}" width="${iw}" height="${y(60)-y(80)}" fill="var(--amber-soft)" opacity=".7"/>
   <path d="M${line[0]} L${line.slice(1).join(' L')} L${x(15)},${y(40)} L${x(0)},${y(40)} Z" fill="var(--blue-soft)" opacity=".6"/>
   <polyline points="${line.join(' ')}" fill="none" stroke="var(--blue)" stroke-width="2.2" stroke-linejoin="round"/>
   ${days.map((o,i)=>o.avg!=null?`<circle cx="${x(i)}" cy="${y(o.avg)}" r="${i===15?4:2.5}" fill="${i===15?'var(--blue)':'#fff'}" stroke="var(--blue)" stroke-width="1.8"><title>${dayLabel(o.d)}: ${o.avg} (${o.n} llamadas)</title></circle>`:'').join('')}
   ${days.map((o,i)=>`<text x="${x(i)}" y="${H-10}" text-anchor="middle" fill="var(--fg-3)">${o.d}</text>`).join('')}
   <text x="${pl}" y="${H}" fill="var(--fg-3)" font-size="10">octubre 2026</text></svg>`;
  const vol=`<svg viewBox="0 0 ${W} 124" width="100%" style="display:block;font-family:var(--sans);font-size:11px">${days.map((o,i)=>{const bw=iw/16-5,bx=pl+i*(iw/16)+3;const sc=v=>v*18;return`<rect x="${bx}" y="${100-sc(o.out)}" width="${bw}" height="${sc(o.out)}" fill="var(--blue)" rx="3"/><rect x="${bx}" y="${100-sc(o.out)-sc(o.inn)}" width="${bw}" height="${sc(o.inn)}" fill="#93c5fd" rx="3"/><text x="${bx+bw/2}" y="116" text-anchor="middle" fill="var(--fg-3)">${o.d}</text>`}).join('')}</svg>`;
  const byAttr=ATTRS.map(a=>{const w1=CALLS.filter(c=>c.day<=8),w2=CALLS.filter(c=>c.day>8);const m=cs=>Math.round(cs.reduce((s,c)=>s+finalScores(c)[a.id],0)/cs.length);return{a,v1:m(w1),v2:m(w2)}}).sort((p,q)=>(q.v2-q.v1)-(p.v2-p.v1));
  $('#p-trends').innerHTML=`<h1>Tendencias</h1><p class="lead">Puntaje final diario (la franja ámbar, 60 a 80, es el rango donde más llamadas se envían a revisión) y volumen por dirección.</p>
   <div class="grid2">
     <div class="card"><h3>Puntaje promedio por día <small>ponderado · 12 atributos</small></h3>${chart}</div>
     <div class="card"><h3>Volumen diario <small><i style="display:inline-block;width:10px;height:10px;background:var(--blue);border-radius:3px"></i> salientes · <i style="display:inline-block;width:10px;height:10px;background:#93c5fd;border-radius:3px"></i> entrantes</small></h3>${vol}
     <h3 style="margin-top:18px">Variación por atributo <small>1–8 oct → 9–16 oct</small></h3>
     ${byAttr.map(r=>`<div class="agree"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px">${r.a.n}</span><div class="bar"><i style="width:${r.v2}%;background:${r.v2-r.v1<0?'var(--amber)':'var(--green)'}"></i></div><span class="num" style="color:${r.v2-r.v1<0?'var(--amber)':'var(--green)'};font-size:12px">${r.v2-r.v1>=0?'+':''}${r.v2-r.v1}</span></div>`).join('')}
     </div>
   </div>`;
}

/* ── CALIBRATION ── */
function renderCalib(){
  const done=CALLS.filter(c=>c.status==='done');
  const per=ATTRS.map(a=>{let agree=0,tot=0,ov=0;done.forEach(c=>{tot++;if(c.human[a.id]!=null){ov++;if(Math.abs(c.human[a.id]-c.ai[a.id])<=10)agree++}else agree++});return{a,agree:Math.round(agree/tot*100),ov}}).sort((p,q)=>q.agree-p.agree);
  const tot=CALLS.length,rev=CALLS.filter(c=>c.status==='rev').length,auto=CALLS.filter(c=>c.status==='auto').length,dn=done.length;
  const totalOv=done.reduce((s,c)=>s+Object.keys(c.human).length,0);
  $('#p-calib').innerHTML=`<h1>Calibración</h1><p class="lead">El sistema evalúa el 100 % de las llamadas y envía a revisión solo las que tienen riesgo, puntaje límite o baja confianza. Cada ajuste de la analista queda registrado y sirve para medir dónde la evaluación automática acierta y dónde todavía hace falta criterio humano.</p>
   <div class="cal">
     <div class="card"><h3>Destino de cada llamada <small>${tot} en el período</small></h3>
     <div class="split"><i style="width:${dn/tot*100}%;background:var(--blue)"></i><i style="width:${rev/tot*100}%;background:var(--amber)"></i><i style="width:${auto/tot*100}%;background:var(--green)"></i></div>
     <div class="leg"><span><i style="background:var(--blue)"></i>${dn} firmadas por la analista</span><span><i style="background:var(--amber)"></i>${rev} esperan revisión</span><span><i style="background:var(--green)"></i>${auto} listas para confirmar</span></div>
     <div class="sum" style="margin-top:18px"><h4>Reparto del trabajo</h4><ul>
     <li><span class="dot ai">${ICO.auto}</span><span><b>Evaluación automática:</b> transcribe, puntúa los 12 atributos con evidencia y confianza, detecta frases de riesgo, redacta borradores de feedback y encuentra patrones por agente.</span></li>
     <li><span class="dot hu">${ICO.human}</span><span><b>Analista:</b> decide en los casos ambiguos, juzga tono y contexto que el texto no captura, define consecuencias de cumplimiento, hace coaching y calibra la matriz.</span></li>
     <li><span class="dot ok">${ICO.ok}</span><span>En octubre la analista escuchó <b>${Math.round(done.reduce((s,c)=>s+c.dur,0)/60)} min</b> de audio en lugar de ${Math.round(CALLS.reduce((s,c)=>s+c.dur,0)/60)}. El tiempo liberado se dedicó a coaching.</span></li></ul></div></div>
     <div class="card"><h3>Acuerdo por atributo <small>±10 pts · ${dn} llamadas · ${totalOv} ajustes</small></h3>
     ${per.map(r=>`<div class="agree"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px" title="${r.a.n}">${r.a.n}</span><div class="bar"><i class="${r.agree<85?'lo':''}" style="width:${r.agree}%"></i></div><span class="num" style="font-size:12px">${r.agree} %</span></div>`).join('')}
     <div style="font-size:13px;color:var(--fg-3);margin-top:14px;line-height:1.6;max-width:60ch">Los atributos con menor acuerdo (${per.slice(-2).map(r=>r.a.n.toLowerCase()).join(', ')}) dependen más de tono y contexto. Ahí el sistema baja su confianza y pide revisión en lugar de decidir.</div></div>
   </div>`;
}

/* ── MATRIX ── */
function renderMatrix(){
  const sum=ATTRS.reduce((s,a)=>s+a.w,0);
  $('#p-matrix').innerHTML=`<h1>Matriz de calidad · Ventas</h1><p class="lead">12 atributos con peso. Cada uno se puntúa de 0 a 100 y el total es el promedio ponderado. Los pesos los define el equipo de calidad; si cambian, se recalculan todas las llamadas del período.</p>
   <div class="card"><h3>Atributos <small>suma de pesos: <b class="num" id="wsum">${sum}</b></small></h3><div class="mx">
   ${ATTRS.map((a,i)=>`<div class="mrow"><div class="i">${String(i+1).padStart(2,'0')}</div><div><div class="n">${a.n}</div><div class="d">${a.d}</div></div><div class="wt"><input type="number" min="0" max="30" value="${a.w}" data-w="${a.id}" id="w-${a.id}" aria-label="Peso"><span style="color:var(--fg-3);font-size:12px">/100</span></div><div class="own"><b>${a.id==='cumplimiento'?'Decide la analista':a.id==='tono'||a.id==='escucha'||a.id==='objeciones'?'Auto + analista':'Automática'}</b>${a.id==='cumplimiento'?'consecuencia humana':a.id==='tono'||a.id==='escucha'||a.id==='objeciones'?'baja confianza frecuente':'alta confianza'}</div></div>`).join('')}
   </div></div>`;
  $('#p-matrix').querySelectorAll('input[data-w]').forEach(inp=>inp.onchange=()=>{
    const a=ATTRS.find(x=>x.id===inp.dataset.w);a.w=clamp(+inp.value||0,0,30);inp.value=a.w;
    $('#wsum').textContent=ATTRS.reduce((s,x)=>s+x.w,0);
    renderKpis();renderList();toast('Pesos actualizados. Puntajes recalculados.');
  });
}

/* ── NAV ── */
function showView(v){
  document.querySelectorAll('.view').forEach(s=>s.classList.toggle('on',s.id==='v-'+v));
  document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===v));
  ({agents:renderAgents,trends:renderTrends,calib:renderCalib,matrix:renderMatrix})[v]?.();
}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>showView(b.dataset.view));
$('#f-dir').querySelectorAll('button').forEach(b=>b.onclick=()=>{F.dir=b.dataset.v;$('#f-dir').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));renderList()});
$('#f-st').onchange=e=>{F.st=e.target.value;renderList()};
$('#q').oninput=e=>{F.q=e.target.value.trim().toLowerCase();renderList()};

renderKpis();
renderList();
</script>
